version: stress_pinn_v1

model:
  type: dde
  in_dim: 6
  out_dim: 4
  hidden: [254, 255, 226, 239]
  activation: tanh
  n_freq: 16

training:
  epochs: 5000
  batch_size: 1024
  lr: 1.0e-3
  scheduler: cosine
  patience: 80
  lambda_data: 1.0
  lambda_pde: 0.1
  lambda_bc: 1.0
  lambda_profile: 0.05

data:
  holdout_frac: 0.15
  seed: 42
  n_folds: 5
